[pytest]
addopts = -m "not stress and not drydown and not release and not hetero_long"
markers =
    stress: slow numerical-stress test (PMIN disabled); run with -m stress
    drydown: 12-day dry-down tests; run with -m drydown
    release: release-rule tests (12 d); run with -m release
    hetero_long: 12-day heterogeneous-vs-uniform test; run with -m hetero_long
